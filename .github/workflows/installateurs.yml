# Fabrique les installateurs à chaque nouvelle version (étiquette vX.Y.Z) :
#   - Windows : Colveto-x.y.z-win-x64.exe (+ .blockmap et latest.yml pour
#     les mises à jour automatiques)
#   - Mac : Colveto-x.y.z-mac-arm64.dmg et Colveto-x.y.z-mac-x64.dmg
# puis crée une release en BROUILLON : relisez les notes et publiez-la à la main
# (les applications installées ne voient que les releases publiées).
name: Installateurs

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # lancement manuel (test), sans release

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: DMG Apple Silicon et Intel
        run: |
          for arch in arm64 x64; do
            npx @electron/rebuild -f -w better-sqlite3 --arch "$arch"
            npx electron-builder --mac dmg "--$arch" --publish never
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release/*.dmg
          if-no-files-found: error

  release:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installateurs
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Colveto ${{ github.ref_name }}
          body: |
            Nouveautés : à compléter avant publication.

            **Installer** : Windows → `Colveto-…-win-x64.exe` · Mac Apple Silicon → `…-mac-arm64.dmg` · Mac Intel → `…-mac-x64.dmg`.
            Les installations existantes se mettent à jour automatiquement (Windows) ou proposent le téléchargement (Mac).
          files: installateurs/*
